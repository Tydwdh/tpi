[package]
name = "tpi-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "TPI application runtime: ApplicationService + RuntimeHandle + command dispatcher + event subscription"

[dependencies]
tpi-core = { path = "../tpi-core" }
tpi-session = { path = "../tpi-session" }
tpi-agent = { path = "../tpi-agent" }
tpi-capabilities = { path = "../tpi-capabilities" }
tpi-config = { path = "../tpi-config" }
tpi-protocol = { path = "../tpi-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
camino = { version = "1", features = ["serde1"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tpi-ui-types = { path = "../tpi-ui-types" }
camino = { version = "1", features = ["serde1"] }
