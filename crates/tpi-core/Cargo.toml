[package]
name = "tpi-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "TPI core layer: pure data types and utilities (ids/message/plan/outcome/util)"

[dependencies]
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", features = ["derive"] }
tracing = "0.1"
blake3 = "1"
notify = "7"

[dev-dependencies]
tempfile = "3"
