[package]
name = "tpi-tui"
version = "0.1.0"
edition = "2024"
description = "TPI TUI layer: ratatui interface (reducer + effect + components)"

[dependencies]
tpi-core = { path = "../tpi-core" }
tpi-session = { path = "../tpi-session" }
tpi-agent = { path = "../tpi-agent" }
tpi-capabilities = { path = "../tpi-capabilities" }
tpi-config = { path = "../tpi-config" }
tpi-ui-types = { path = "../tpi-ui-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
ratatui = { version = "0.30", features = ["scrolling-regions"] }
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = "0.13"
html2text = "0.17"
regex = "1"
syntect = "5"
two-face = "0.5"
time = { version = "0.3", features = ["formatting"] }
camino = { version = "1", features = ["serde1"] }
toml = "1"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
