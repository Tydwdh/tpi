[package]
name = "tpi-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "TPI TUI layer: ratatui interface (reducer + effect + components)"

[dependencies]
tpi-core = { path = "../tpi-core" }
tpi-session = { path = "../tpi-session" }
tpi-agent = { path = "../tpi-agent" }
tpi-ui-types = { path = "../tpi-ui-types" }
serde_json = "1"
tracing = "0.1"
ratatui = { version = "0.30", features = ["scrolling-regions"] }
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = "0.13"
regex = "1"
syntect = "5"
two-face = "0.5"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
