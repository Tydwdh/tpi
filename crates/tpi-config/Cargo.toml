[package]
name = "tpi-config"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "TPI configuration layer: Config/ModelConfig/AgentConfig, auth (credential manager)"

[dependencies]
tpi-core = { path = "../tpi-core" }
tpi-ui-types = { path = "../tpi-ui-types" }
serde = { version = "1", features = ["derive"] }
toml = "1"
camino = { version = "1", features = ["serde1"] }
keyring = { version = "4.1", features = ["windows-native-keyring-store"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
