[package]
name = "tpi-session"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "TPI session layer: durable JSONL event store, projection, recovery"

[dependencies]
tpi-core = { path = "../tpi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
blake3 = "1"
camino = { version = "1", features = ["serde1"] }
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
tempfile = "3"
