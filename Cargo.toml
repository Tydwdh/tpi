[workspace]
members = [
  ".",
  "crates/tpi-core",
  "crates/tpi-session",
  "crates/tpi-capabilities",
  "crates/tpi-ui-types",
  "crates/tpi-config",
  "crates/tpi-agent",
  "crates/tpi-tui",
]
resolver = "2"

[package]
name = "tpi"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
description = "A personal terminal coding agent for Windows"

[dependencies]
tpi-core = { path = "crates/tpi-core" }
tpi-session = { path = "crates/tpi-session" }
tpi-capabilities = { path = "crates/tpi-capabilities" }
tpi-config = { path = "crates/tpi-config" }
tpi-agent = { path = "crates/tpi-agent" }
tpi-tui = { path = "crates/tpi-tui" }
tokio = { version = "1.53", features = [
  "rt-multi-thread", "macros", "process", "signal", "sync",
  "time", "fs", "io-util"
] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls", "system-proxy", "charset", "http2", "json", "stream"
] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
blake3 = "1"
ratatui = { version = "0.30", features = ["scrolling-regions"] }
unicode-width = "0.2"
camino = { version = "1", features = ["serde1"] }
russh = "0.62.6"
russh-sftp = "2.4.0"
async-trait = "0.1.92"

[dev-dependencies]
tempfile = "3"
proptest = "1"
socket2 = "0.6"
rand = "0.10.2"
serial_test = "3"

# P7-03 feature audit：windows-sys 只应在 Windows 编译（非目标平台不解析
# Win32 依赖；代码侧已有 #[cfg(windows)] 保护，依赖侧一并 target-gate）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects",
  "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
