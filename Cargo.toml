[package]
name = "tpi"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A personal terminal coding agent for Windows"

[dependencies]
tokio = { version = "1.53", features = [
  "rt-multi-thread", "macros", "process", "signal", "sync",
  "time", "fs", "io-util"
] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls", "system-proxy", "charset", "http2", "json", "stream"
] }
eventsource-stream = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
blake3 = "1"
schemars = { version = "1.2", features = ["derive"] }
ratatui = { version = "0.30", features = ["scrolling-regions"] }
unicode-width = "0.2"
pulldown-cmark = "0.13"
html2text = "0.17"
keyring = { version = "4.1", features = ["windows-native-keyring-store"] }
camino = "1"
ignore = "0.4"
regex = "1"
similar = "3"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects",
  "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security"
] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
socket2 = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
