name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks
      # P0-07：架构依赖 gate（tui->app / agent->tui / 新增 global_registry 均拒绝）
      - name: Architecture gate
        run: bash scripts/arch_gate.sh
      - run: cargo test --all-targets --all-features

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # P10-04：与 deny.toml 的 ignore 列表对齐（rsa 无修复版 + syntect 的
      # unmaintained 传递依赖；理由见 deny.toml）。
      - run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2024-0320
      # P10-04：deny（advisories/licenses/bans/sources）+ 未用依赖检查。
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.2
      - run: cargo machete
