name = "search-001"
suite = "core"
title = "在大文件中定位并修复 panic 行（Rust）"
timeout_sec = 900

[[verify]]
type = "bash"
command = 'cargo build'
expect_exit = 0
expect_stdout_contains = ['Finished']
[[verify]]
type = "bash"
command = './target/debug/search_001.exe'
expect_exit = 0
expect_stdout_contains = ['Some(0)']
[[verify]]
type = "bash"
command = './target/debug/search_001.exe'
expect_exit = 0
expect_stdout_contains = ['None']
