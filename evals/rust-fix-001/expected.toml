name = "rust-fix-001"
suite = "core"
title = "修复借用检查错误（Rust 编译失败）"
timeout_sec = 900

[[verify]]
type = "bash"
command = 'cargo build'
expect_exit = 0
expect_stderr_contains = ['Finished']
[[verify]]
type = "bash"
command = './target/debug/rust_fix_001.exe'
expect_exit = 0
expect_stdout_contains = ['first=1 len=4']
